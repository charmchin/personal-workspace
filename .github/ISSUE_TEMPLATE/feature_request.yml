name: 功能建议
description: 说明真实需求和期望行为，不提交私人业务内容
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决什么问题
      description: 请说明场景和现有操作的困难，使用虚构示例。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 说明结果；涉及联网、权限或数据保存时请明确边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方法与其他说明（可选）
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 本建议与附件不包含私人记录或凭据。
          required: true
