[package]
name = "personal-workbench"
version = "0.1.3"
description = "Local-first personal workbench for macOS"
authors = ["Personal Workbench"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "personal_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
age = "0.12.1"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
hex = "0.4.3"
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled-sqlcipher-vendored-openssl", "serialize"] }
rust_decimal = { version = "1.42.1", features = ["serde-with-str"] }
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
tar = "0.4.44"
tempfile = "3.27.0"
thiserror = "2.0.16"
uuid = { version = "1.26.0", features = ["serde", "v7"] }
zeroize = "1.8.1"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSDistributedNotificationCenter", "NSString", "NSOperation", "NSObject", "NSRunLoop", "NSDate", "block2"] }

[[test]]
name = "native_lock_smoke"
path = "tests/native_lock_smoke.rs"
harness = false
